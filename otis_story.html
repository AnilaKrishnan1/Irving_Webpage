<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Carousel with Characters</title>
  <style>
    .carousel {
      position: relative;
      width: 500px;
      height: 300px;
      margin: auto;
      overflow: hidden;
    }

    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .slide {
      position: relative;
      min-width: 100%;
      height: 100%;
    }

    .background {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .character {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: auto;
      pointer-events: none; /* so clicks go through */
    }

    .controls {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="carousel">
    <div class="slides">
      <!-- Slide 1 -->
      <div class="slide">
        <img class="background" src="background1.jpg" alt="Scene 1">
        <img class="character" id="char1" src="character1.png" alt="Character">
      </div>

      <!-- Slide 2 -->
      <div class="slide">
        <img class="background" src="background2.jpg" alt="Scene 2">
        <img class="character" id="char2" src="character1.png" alt="Character">
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="prevSlide()">⟨ Prev</button>
    <button onclick="nextSlide()">Next ⟩</button>
    <br><br>
    <button onclick="swapCharacter('character1.png')">Character 1</button>
    <button onclick="swapCharacter('character2.png')">Character 2</button>
  </div>

  <script>
    let currentIndex = 0;
    const slides = document.querySelector('.slides');

    function showSlide(index) {
      const totalSlides = document.querySelectorAll('.slide').length;
      if (index >= totalSlides) index = 0;
      if (index < 0) index = totalSlides - 1;
      currentIndex = index;
      slides.style.transform = `translateX(-${index * 100}%)`;
    }

    function nextSlide() {
      showSlide(currentIndex + 1);
    }

    function prevSlide() {
      showSlide(currentIndex - 1);
    }

    // Change character layer for all slides
    function swapCharacter(imgSrc) {
      document.querySelectorAll('.character').forEach(char => {
        char.src = imgSrc;
      });
    }
  </script>
</body>
</html>
