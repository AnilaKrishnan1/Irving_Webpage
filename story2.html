<div class="side-tab" id="side-tab" onclick="toggleInfo()">Scene 1</div>

<!-- Info Popup -->
<div class="info-popup" id="info-popup">
  <h3 id="info-title"></h3>
  <img id="info-img" src="" alt="">
  <p id="info-desc"></p>
  <a id="info-link" href="#" target="_blank">Visit Website</a>
</div>

<script>

  // Resizes images for other screens
      window.onload = () => imageMapResize();
  
const slides = document.querySelector('.slides');
const slideElements = document.querySelectorAll('.slide');
const totalSlides = slideElements.length;
let currentIndex = 0;
// Data for the info tabs
const tabData = [
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com" },
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com" },
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com."},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Las Colinas Mustangs", image: "LasColinasMustangs.jpeg", description: "Otis finishes his journey by returning back to his place at the Las Colinas Mustangs.", link: "https://www.irvingarchivesandmuseum.com/mustangs-of-las-colinas" },
];

function showSlide(index) {
  if (index >= totalSlides) index = 0;
  if (index < 0) index = totalSlides - 1;
  currentIndex = index;
  slides.style.transform = `translateX(-${index*100}%)`;
  document.getElementById('slide-number').innerText = `Slide ${currentIndex+1} of ${totalSlides}`;
  updateTab();
  hideInfo();
}

function nextSlide() { showSlide(currentIndex+1); }
function prevSlide() { showSlide(currentIndex-1); }

function updateTab() {
  const tab = document.getElementById('side-tab');
  const data = tabData[currentIndex];
  tab.innerText = data.title;
}

function toggleInfo() {
  const popup = document.getElementById('info-popup');
  if(popup.style.display === 'block') {
    popup.style.display = 'none';
  } else {
    const data = tabData[currentIndex];
    document.getElementById('info-title').innerText = data.title;
    document.getElementById('info-img').src = data.image;
    document.getElementById('info-desc').innerText = data.description;
    document.getElementById('info-link').href = data.link;
    popup.style.display = 'block';
  }
}
  // Close info popup when clicking outside
  document.addEventListener('click', function(event) {
    const popup = document.getElementById('info-popup');
    const tab = document.getElementById('side-tab');
  
    // If popup is open and the click is NOT inside the popup or the tab
    if (
      popup.style.display === 'block' &&
      !popup.contains(event.target) &&
      !tab.contains(event.target)
    ) {
      popup.style.display = 'none';
    }
  });

function hideInfo() {
  document.getElementById('info-popup').style.display = 'none';
}

// Initialize
showSlide(0);
</script>

</body>
</html>
