<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Carousel with Characters</title>
  <style>
    .carousel {
      position: relative;
      width: 500px;
      height: 300px;
      margin: auto;
      overflow: hidden;
    }

    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .slide {
      position: relative;
      min-width: 100%;
      height: 100%;
    }

    .background {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .character {
      position: absolute;
      bottom: 20%;
      left: 110%;
      transform: translateX(-50%);
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .controls {
      text-align: center;
      margin-top: 10px;
    }

    /* Character picker */
    .character-picker {
      text-align: center;
      margin: 15px 0;
    }
    .character-picker img {
      width: 60px;
      height: auto;
      margin: 5px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 10px;
    }
    .character-picker img:hover {
      border-color: blue;
    }
    /* Slide 1 position */
    .char1 {
      bottom: 100%;
      left: 100%;
      width: 100%;
    }
    .char2 {
      bottom: 20%;
      left: 100%;
      width: 100%;
    }
    .char3 {
      bottom: 20%;
      left: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- Carousel -->
  <div class="carousel">
    <div class="slides">
      <!-- Slide 1 -->
      <div class="slide">
        <img class="character" id="char1" src="boy1.png" alt="Character">
         <img class="character char1" style="display:none" alt="Character">
      </div>

      <!-- Slide 2 -->
      <div class="slide">
        <img class="background" src="1.png" alt="Scene 2">
        <img class="character" id="char2" src="girl1.png" alt="Character">
        <img class="character char2" style="display:none" alt="Character">
      </div>

       <!-- Slide 3 -->
      <div class="slide">
        <img class="background" src="2.png" alt="Scene 3">
        <img class="character" id="char2" src="girl1.png" alt="Character">
        <img class="character char3" style="display:none" alt="Character">
      </div>
    </div>
  </div>

  <!-- Navigation buttons -->
  <div class="controls">
    <button onclick="prevSlide()">⟨ Prev</button>
    <button onclick="nextSlide()">Next ⟩</button>
  </div>

  <!-- Character picker thumbnails -->
  <div class="character-picker">
    <p>Choose your character:</p>
    <img src="boy1.png" alt="Character 1" onclick="swapCharacter('boy1.png')">
    <img src="boy2.png" alt="Character 2" onclick="swapCharacter('boy2.png')">
    <img src="girl1.png" alt="Character 3" onclick="swapCharacter('girl1.png')">
    <img src="girl2.png" alt="Character 3" onclick="swapCharacter('girl2.png')">
  </div>

  <script>
    let currentIndex = 0;
    const slides = document.querySelector('.slides');

    function showSlide(index) {
      const totalSlides = document.querySelectorAll('.slide').length;
      if (index >= totalSlides) index = 0;
      if (index < 0) index = totalSlides - 1;
      currentIndex = index;
      slides.style.transform = `translateX(-${index * 100}%)`;
    }

    function nextSlide() {
      showSlide(currentIndex + 1);
    }

    function prevSlide() {
      showSlide(currentIndex - 1);
    }

    // Swap all character layers
    function swapCharacter(imgSrc) {
      document.querySelectorAll('.character').forEach(char => {
        char.src = imgSrc;
      });
    }
  </script>
</body>
</html>
