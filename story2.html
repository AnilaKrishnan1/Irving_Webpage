<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story 2</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Lexend', sans-serif; margin:0; padding:0; background:#f0f9f9; text-align:center; }

  /* Navbar */
  .navbar { display:flex; justify-content:space-between; align-items:center; background:teal; padding:10px 20px; position:sticky; top:0; z-index:1000; box-shadow:0 2px 5px rgba(0,0,0,0.2);}
  .navbar .logo img { height:50px; }
  .navbar-links { display:flex; gap:15px; }
  .navbar a { color:white; text-decoration:none; font-weight:bold; padding:8px 12px; border-radius:5px; transition:background-color 0.3s; }
  .navbar a:hover { background-color:darkcyan; }
  .navbar a.active { background-color:#004d4d; }
  .navbar a.active {
    background: white;
    color: teal;
  }

  /* Carousel */
  .carousel { position:relative; width:900px; height:600px; margin:30px auto; border-radius:15px; overflow:hidden; background:#f0f9f9; }
  .slides { display:flex; transition:transform 0.5s ease-in-out; }
  .slide { min-width:100%; height:100%; }
  .background { width:100%; height:100%; object-fit:cover; }

  /* Controls */
  .controls { margin-top:15px; }
  .controls button { padding:10px 20px; margin:0 5px; border:none; background:teal; color:white; font-size:16px; font-weight:bold; border-radius:8px; cursor:pointer; }
  .controls button:hover { background-color:darkcyan; }

  #slide-number { position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.6); color:white; padding:5px 12px; border-radius:12px; font-size:14px; }

  /* Single Side Tab */
  .side-tab { position:fixed; top:150px; right:0; background:teal; color:white; padding:12px 20px; cursor:pointer; border-radius:8px 0 0 8px; text-align:center; z-index:1000; transition: background 0.3s;}
  .side-tab:hover { background-color:darkcyan; }

  /* Info Popup */
  .info-popup { display:none; position:fixed; top:150px; right:130px; width:300px; background:white; padding:15px 20px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.2); text-align:left; z-index:1000; }
  .info-popup img { max-width:100%; border-radius:8px; margin-bottom:10px; }
  .info-popup a { display:block; margin-top:10px; color:teal; text-decoration:underline; }
</style>
</head>
<body>

<div class="navbar">
  <a href="index.html" class="logo"><img src="museum_logo.png" alt="Irving History Logo"></a>
  <div class="navbar-links">
    <a href="index.html" class="active">Map</a>
    <a href="otis_story.html">Stories</a>
  </div>
</div>

<!-- Carousel -->
<div class="carousel">
  <div class="slides">
    <div class="slide"><img class="background" src="Story2_1.png" alt="Scene 1"></div>
    <div class="slide"><img class="background" src="Story2_2.png" alt="Scene 2"></div>
    <div class="slide"><img class="background" src="Story2_3.png" alt="Scene 3"></div>
    <div class="slide"><img class="background" src="Story2_4.png" alt="Scene 4"></div>
    <div class="slide"><img class="background" src="Story2_5.png" alt="Scene 5"></div>
    <div class="slide"><img class="background" src="Story2_6.png" alt="Scene 6"></div>
    <div class="slide"><img class="background" src="Story2_7.png" alt="Scene 7"></div>
    <div class="slide"><img class="background" src="Story2_8.png" alt="Scene 8"></div>
    <div class="slide"><img class="background" src="Story2_9.png" alt="Scene 9"></div>
    <div class="slide"><img class="background" src="Story2_10.png" alt="Scene 10"></div>
    <div class="slide"><img class="background" src="Story2_11.png" alt="Scene 11"></div>
    <div class="slide"><img class="background" src="Story2_12.png" alt="Scene 12"></div>
  </div>
  <div id="slide-number">Slide 1 of 12</div>
</div>

<div class="controls">
  <button onclick="prevSlide()">⟨ Prev</button>
  <button onclick="nextSlide()">Next ⟩</button>
</div>

<!-- Single Tab -->
<div class="side-tab" id="side-tab" onclick="toggleInfo()">Scene 1</div>

<!-- Info Popup -->
<div class="info-popup" id="info-popup">
  <h3 id="info-title"></h3>
  <img id="info-img" src="" alt="">
  <p id="info-desc"></p>
  <a id="info-link" href="#" target="_blank">Visit Website</a>
</div>

<script>

  // Resizes images for other screens
      window.onload = () => imageMapResize();
  
const slides = document.querySelector('.slides');
const slideElements = document.querySelectorAll('.slide');
const totalSlides = slideElements.length;
let currentIndex = 0;
// Data for the info tabs
const tabData = [
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com" },
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com" },
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com."},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Toyota Music Factory", image: "Toyota_Music_Factory.webp", description: "Otis starts his adventure at the Toyota Music Factory. A place filled with good food, music, and fun.", link: "https://www.toyotamusicfactory.com"},
  { title: "Las Colinas Mustangs", image: "LasColinasMustangs.jpeg", description: "Otis finishes his journey by returning back to his place at the Las Colinas Mustangs.", link: "https://www.irvingarchivesandmuseum.com/mustangs-of-las-colinas" },
];

function showSlide(index) {
  if (index >= totalSlides) index = 0;
  if (index < 0) index = totalSlides - 1;
  currentIndex = index;
  slides.style.transform = `translateX(-${index*100}%)`;
  document.getElementById('slide-number').innerText = `Slide ${currentIndex+1} of ${totalSlides}`;
  updateTab();
  hideInfo();
}

function nextSlide() { showSlide(currentIndex+1); }
function prevSlide() { showSlide(currentIndex-1); }

function updateTab() {
  const tab = document.getElementById('side-tab');
  const data = tabData[currentIndex];
  tab.innerText = data.title;
}

function toggleInfo() {
  const popup = document.getElementById('info-popup');
  if(popup.style.display === 'block') {
    popup.style.display = 'none';
  } else {
    const data = tabData[currentIndex];
    document.getElementById('info-title').innerText = data.title;
    document.getElementById('info-img').src = data.image;
    document.getElementById('info-desc').innerText = data.description;
    document.getElementById('info-link').href = data.link;
    popup.style.display = 'block';
  }
}
  // Close info popup when clicking outside
  document.addEventListener('click', function(event) {
    const popup = document.getElementById('info-popup');
    const tab = document.getElementById('side-tab');
  
    // If popup is open and the click is NOT inside the popup or the tab
    if (
      popup.style.display === 'block' &&
      !popup.contains(event.target) &&
      !tab.contains(event.target)
    ) {
      popup.style.display = 'none';
    }
  });

function hideInfo() {
  document.getElementById('info-popup').style.display = 'none';
}

// Initialize
showSlide(0);
</script>

</body>
</html>
