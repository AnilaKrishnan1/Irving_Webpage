<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irving Map | History & Landmarks</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lexend', sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      background-color: #f9f9f9;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: center;
      background-color: teal;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .navbar a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .navbar a:hover {
      background-color: darkcyan;
    }

    /* Highlight selected tab */
    .navbar a.active {
      background-color: #004d4d;
    }

    /* Page content */
    .content {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    .map-container {
      margin: 20px auto;
      max-width: 90%;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    /* Footer */
    footer {
      background-color: teal;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 40px;
    }

    /* Responsive navbar */
    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
      }
      .navbar a {
        text-align: center;
        border-top: 1px solid rgba(255,255,255,0.3);
      }
    }
  </style>
</head>
<body>
<div class="navbar">
  <!-- Branding / site title -->
  <a href="index.html" class="logo">Irving History</a>

  <!-- Links grouped together -->
  <div class="navbar-links">
    <a href="index.html" class="active">Map</a>
    <a href="otis_story.html">Stories</a>
    <a href="something.html">Something Else</a>
  </div>
</div>

  <!-- Page content -->
  <div class="content">
    <h2>Explore Irving’s Landmarks</h2>
    <p>Click on the highlighted spots on the map to discover their history and stories.</p>

    <!-- Map goes here -->
    <div class="map-container">
      <img src="irvingmap3.jpg" usemap="#image-map" alt="Irving Map">

      <map name="image-map">
        <area alt="Irving Archives and Museum" title="Irving Archives and Museum" href="page.html" coords="304,761,379,797" shape="rect">
        <area alt="Convention Center" title="Convention Center" href="page2.html" coords="393,362,471,451" shape="rect">

  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Irving History Project | Built by Anila</p>
  </footer>

</html>
