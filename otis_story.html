<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Carousel with Characters</title>
  <style>
    .carousel {
      position: relative;
      width: 500px;
      height: 300px;
      margin: auto;
      overflow: hidden;
    }

    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .slide {
      position: relative;
      min-width: 100%;
      height: 100%;
    }

    .background {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .character {
      position: absolute;
      bottom: 20%;
      left: 110%;
      transform: translateX(-50%);
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .controls {
      text-align: center;
      margin-top: 10px;
    }

    /* Character picker */
    .character-picker {
      text-align: center;
      margin: 15px 0;
    }
    .character-picker img {
      width: 60px;
      height: auto;
      margin: 5px;
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 10px;
    }
    .character-picker img:hover {
      border-color: blue;
    }
    /* Slide 1 position */
    .char1 {
      bottom: 100px;
      left: 100%;
      width: 100%;
    }
    .char2 {
      bottom: 20%;
      left: 111%;
      width: 100%;
    }
    .char3 {
      bottom: 20%;
      left: 115%;
      width: 100%;
    }
    .char4 {
      bottom: 20%;
      left: 115%;
      width: 100%;
    }
    .char5 {
      bottom: 20%;
      left: 115%;
      width: 80%;
    }
    .char6 {
      bottom: 20%;
      left: 76%;
      width: 80%;
    }
    .char7 {
      bottom: 20%;
      left: 111%;
      width: 80%;
    }
    .char8 {
      bottom: 30%;
      left: 100%;
      width: 80%;
    }
    .char9 {
      bottom: 20%;
      left: 100%;
      width: 100%;
    }
    .char10 {
      bottom: 20%;
      left: 100%;
      width: 100%;
    }
    .char11 {
      bottom: 20%;
      left: 100%;
      width: 100%;
    }
    .char12 {
      bottom: 20%;
      left: 100%;
      width: 100%;
    }
    .char13 {
      bottom: 20%;
      left: 100%;
      width: 100%;
    }
    .char14 {
      bottom: 20%;
      left: 100%;
      width: 100%;
    }
    .char15 {
      bottom: 20%;
      left: 100%;
      width: 100%;
    }
    .char16 {
      bottom: 20%;
      left: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <!-- Carousel -->
  <div class="carousel">
    <div class="slides">
      <!-- Slide 1 -->
      <div class="slide">
        <img class="character char1" style="display:none" alt="Character">
      </div>

      <!-- Slide 2 -->
      <div class="slide">
        <img class="background" src="1.png" alt="Scene 2">
        <img class="character char2" style="display:none" alt="Character">
      </div>

       <!-- Slide 3 -->
      <div class="slide">
        <img class="background" src="2.png" alt="Scene 3">
        <img class="character char3" style="display:none" alt="Character">
      </div>
      
       <!-- Slide 4 -->
      <div class="slide">
        <img class="background" src="3.png" alt="Scene 4">
        <img class="character char4" style="display:none" alt="Character">
      </div>
        <!-- Slide 5 -->
      <div class="slide">
        <img class="background" src="4.png" alt="Scene 5">
        <img class="character char5" style="display:none" alt="Character">
      </div>
       <!-- Slide 6 -->
      <div class="slide">
        <img class="background" src="5.png" alt="Scene 6">
        <img class="character char6" style="display:none" alt="Character">
      </div>
       <!-- Slide 7 -->
      <div class="slide">
        <img class="background" src="6.png" alt="Scene 7">
        <img class="character char7" style="display:none" alt="Character">
      </div>
       <!-- Slide 8 -->
      <div class="slide">
        <img class="background" src="7.png" alt="Scene 8">
        <img class="character char8" style="display:none" alt="Character">
      </div>
        <!-- Slide 9 -->
      <div class="slide">
        <img class="background" src="8.png" alt="Scene 9">
        <img class="character char9" style="display:none" alt="Character">
      </div>
        <!-- Slide 10 -->
      <div class="slide">
        <img class="background" src="9.png" alt="Scene 10">
        <img class="character char10" style="display:none" alt="Character">
      </div>
       <!-- Slide 11 -->
      <div class="slide">
        <img class="background" src="10.png" alt="Scene 11">
        <img class="character char11" style="display:none" alt="Character">
      </div>
       <!-- Slide 12 -->
      <div class="slide">
        <img class="background" src="11.png" alt="Scene 12">
        <img class="character char12" style="display:none" alt="Character">
      </div>
        <!-- Slide 13 -->
      <div class="slide">
        <img class="background" src="12.png" alt="Scene 13">
        <img class="character char13" style="display:none" alt="Character">
      </div>
       <!-- Slide 14 -->
      <div class="slide">
        <img class="background" src="13.png" alt="Scene 14">
        <img class="character char14" style="display:none" alt="Character">
      </div>
       <!-- Slide 15 -->
      <div class="slide">
        <img class="background" src="14.png" alt="Scene 15">
        <img class="character char15" style="display:none" alt="Character">
      </div>
       <!-- Slide 16 -->
      <div class="slide">
        <img class="background" src="15.png" alt="Scene 16">
        <img class="character char16" style="display:none" alt="Character">
      </div>
      <div id="slide-number" style="text-align:center; margin-top:10px;">Slide 1 of 3</div>
    </div>
  </div>

  <!-- Navigation buttons -->
  <div class="controls">
    <button onclick="prevSlide()">⟨ Prev</button>
    <button onclick="nextSlide()">Next ⟩</button>
  </div>

  <!-- Character picker thumbnails -->
  <div class="character-picker">
    <p>Choose your character:</p>
    <img src="boy1.png" alt="Character 1" onclick="swapCharacter('boy1.png')">
    <img src="boy2.png" alt="Character 2" onclick="swapCharacter('boy2.png')">
    <img src="girl1.png" alt="Character 3" onclick="swapCharacter('girl1.png')">
    <img src="girl2.png" alt="Character 3" onclick="swapCharacter('girl2.png')">
  </div>

  <script>
    let currentIndex = 0;
    const slides = document.querySelector('.slides');

    function showSlide(index) {
      const totalSlides = document.querySelectorAll('.slide').length;
      if (index >= totalSlides) index = 0;
      if (index < 0) index = totalSlides - 1;
      currentIndex = index;
      slides.style.transform = `translateX(-${index * 100}%)`;
    }

    function nextSlide() {
      showSlide(currentIndex + 1);
    }

    function prevSlide() {
      showSlide(currentIndex - 1);
    }

    // Swap all character layers
    function swapCharacter(imgSrc) {
      document.querySelectorAll('.character').forEach(char => {
        char.src = imgSrc;
      });
    }
    function swapCharacter(imgSrc) {
  document.querySelectorAll('.character').forEach(char => {
    char.src = imgSrc;          // change character
    char.style.display = "block"; // show it
  });
}
  </script>
</body>
</html>
