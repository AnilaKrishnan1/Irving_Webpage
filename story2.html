  <style>
    body {
      font-family: 'Lexend', sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f9f9;
      text-align: center;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: teal;
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .navbar .logo img {
      height: 50px;
    }

    .navbar-links {
      display: flex;
      gap: 15px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .navbar a:hover {
      background-color: darkcyan;
    }

    .navbar a.active {
      background-color: #004d4d;
    }

      /* Carousel */
    .carousel {
      position: relative;
      width: 900px;  /* bigger story view */
      height: 600px;
      margin: 30px auto;
      border-radius: 15px;
      overflow: hidden;
      background: #f0f9f9;
    }
    .slides {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }
    .slide {
      position: relative;
      min-width: 100%;
      height: 100%;
    }
    .background {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
   /* Controls */
    .controls {
      margin-top: 15px;
    }
    .controls button {
      padding: 10px 20px;
      margin: 0 5px;
      border: none;
      background: teal;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .controls button:hover {
      background: darkcyan;
    }

    /* Slide counter */
    #slide-number {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 14px;
    }
/* For the information tabs */
.side-tabs {
  position: fixed;
  top: 150px;
  right: 0;
  display: flex;
  flex-direction: column;
  z-index: 1000;
}

.tab {

  padding: 12px 20px;

  border-radius: 8px 0 0 8px;

}
.tab-info a {

  margin-top: 10px;

  text-decoration: underline;

    let currentIndex = 0;
    const slides = document.querySelector('.slides');
    const slideElements = document.querySelectorAll('.slide');
    const totalSlides = slideElements.length;

    // Show slide
    function showSlide(index) {
      if (index >= totalSlides) index = 0;
      if (index < 0) index = totalSlides - 1;
      currentIndex = index;
      slides.style.transform = `translateX(-${index * 100}%)`;
      updateSlideNumber();
    }

    function nextSlide() { showSlide(currentIndex + 1); }
    function prevSlide() { showSlide(currentIndex - 1); }

    function updateSlideNumber() {
      document.getElementById("slide-number").innerText =
        `Slide ${currentIndex + 1} of ${totalSlides}`;
    }
  showSlide(0);

function updateTabInfo(index) {
  const data = tabData[index];
  if (!data) return; // If tabData not defined for this slide
  const img = document.getElementById("location-image");
  document.getElementById("location-title").innerText = data.title;
  img.src = data.image;
  img.style.display = "block";
  document.getElementById("location-description").innerText = data.description;
  const link = document.getElementById("location-link");
  link.href = data.link;
  link.style.display = "block";
  link.innerText = "Visit Website";
