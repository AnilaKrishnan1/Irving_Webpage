<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story 1</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Lexend', sans-serif; margin:0; padding:0; background:#f0f9f9; text-align:center; }

  /* Navbar */
  .navbar { display:flex; justify-content:space-between; align-items:center; background:teal; padding:10px 20px; position:sticky; top:0; z-index:1000; box-shadow:0 2px 5px rgba(0,0,0,0.2);}
  .navbar .logo img { height:50px; }
  .navbar-links { display:flex; gap:15px; }
  .navbar a { color:white; text-decoration:none; font-weight:bold; padding:8px 12px; border-radius:5px; transition:background-color 0.3s; }
  .navbar a:hover { background-color:darkcyan; }
  .navbar a.active { background-color:white; color:teal; }

  /* Carousel */
  .carousel { position:relative; width:900px; height:600px; margin:30px auto; border-radius:15px; overflow:hidden; background:#f0f9f9; }
  .slides { display:flex; transition:transform 0.5s ease-in-out; }
  .slide { min-width:100%; height:100%; position:relative; }
  .background { width:100%; height:100%; object-fit:cover; }

  /* Characters */
  .character { position:absolute; bottom:10%; left:50%; transform:translateX(-50%); width:15%; pointer-events:none; display:none; }
  .char1 { left:70%; bottom:15%; } 
  .char2 { left:75%; bottom:15%; }
  .char3 { left:73%; bottom:15%; }
  .char4 { left:78%; bottom:15%; }
  .char5 { left:38%; bottom:15%; }
  .char6 { left:77%; bottom:7%; }
  .char7 { left:63%; bottom:10%; }
  .char8 { left:73%; bottom:1%; }
  .char9 { left:60%; bottom:1%; }
  .char10 { left:25%; bottom:12%; }
  .char11 { left:28%; bottom:15%; }
  .char12 { left:35%; bottom:15%; }
  .char13 { left:75%; bottom:15%; }
  .char14 { left:60%; bottom:15%; }
  .char15 { left:60%; bottom:15%; }

  /* Controls */
  .controls { margin-top:15px; }
  .controls button { padding:10px 20px; margin:0 5px; border:none; background:teal; color:white; font-size:16px; font-weight:bold; border-radius:8px; cursor:pointer; }
  .controls button:hover { background-color:darkcyan; }

  /* Slide counter */
  #slide-number { position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.6); color:white; padding:5px 12px; border-radius:12px; font-size:14px; }

  /* Side Tab */
  .side-tab { position:fixed; top:150px; right:0; background:teal; color:white; padding:12px 20px; cursor:pointer; border-radius:8px 0 0 8px; text-align:center; z-index:1000; transition: background 0.3s;}
  .side-tab:hover { background-color:darkcyan; }

  /* Info Popup */
  .info-popup { display:none; position:fixed; top:150px; right:130px; width:300px; background:white; padding:15px 20px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.2); text-align:left; z-index:1000; }
  .info-popup img { max-width:100%; border-radius:8px; margin-bottom:10px; }
  .info-popup a { display:block; margin-top:10px; color:teal; text-decoration:underline; }
</style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <a href="index.html" class="logo"><img src="museum_logo.png" alt="Irving History Logo"></a>
  <div class="navbar-links">
    <a href="index.html" class="active">Map</a>
    <a href="otis_story.html">Stories</a>
  </div>
</div>

<!-- Carousel -->
<div class="carousel">
  <div class="slides">
    <div class="slide">
      <div class="picker">
        <p>Choose your character:</p>
        <img src="boy1.png" alt="Boy 1" onclick="swapCharacter('boy1.png')">
        <img src="boy2.png" alt="Boy 2" onclick="swapCharacter('boy2.png')">
        <img src="girl1.png" alt="Girl 1" onclick="swapCharacter('girl1.png')">
        <img src="girl2.png" alt="Girl 2" onclick="swapCharacter('girl2.png')">
      </div>
    </div>
    <!-- Story slides -->
    <div class="slide"><img class="background" src="1.png"><img class="character char1"></div>
    <div class="slide"><img class="background" src="2.png"><img class="character char2"></div>
    <div class="slide"><img class="background" src="3.png"><img class="character char3"></div>
    <div class="slide"><img class="background" src="4.png"><img class="character char4"></div>
    <div class="slide"><img class="background" src="5.png"><img class="character char5"></div>
    <div class="slide"><img class="background" src="6.png"><img class="character char6"></div>
    <div class="slide"><img class="background" src="7.png"><img class="character char7"></div>
    <div class="slide"><img class="background" src="8.png"><img class="character char8"></div>
    <div class="slide"><img class="background" src="9.png"><img class="character char9"></div>
    <div class="slide"><img class="background" src="10.png"><img class="character char10"></div>
    <div class="slide"><img class="background" src="11.png"><img class="character char11"></div>
    <div class="slide"><img class="background" src="12.png"><img class="character char12"></div>
    <div class="slide"><img class="background" src="13.png"><img class="character char13"></div>
    <div class="slide"><img class="background" src="14.png"><img class="character char14"></div>
    <div class="slide"><img class="background" src="15.png"><img class="character char15"></div>
  </div>
  <div id="slide-number">Slide 1 of 16</div>
</div>

<!-- Navigation buttons -->
<div class="controls">
  <button onclick="prevSlide()">⟨ Prev</button>
  <button onclick="nextSlide()">Next ⟩</button>
</div>

<!-- Side Tab -->
<div class="side-tab" id="side-tab"></div>

<!-- Info Popup -->
<div class="info-popup" id="info-popup">
  <h3 id="info-title"></h3>
  <img id="info-img" src="" alt="">
  <p id="info-desc"></p>
  <a id="info-link" href="#" target="_blank">Open Location</a>
</div>

<script>
let currentIndex = 0;
const slides = document.querySelector('.slides');
const slideElements = document.querySelectorAll('.slide');
const totalSlides = slideElements.length;

const tabData = [
  { title: "Fritz Park", image: "FritzPark.jpeg", description: "Our characters start their journey at Fritz Park...", link: "https://maps.app.goo.gl/pE6Vigf3v23k8n7c7" },
  { title: "Fritz Park", image: "FritzPark.jpeg", description: "Our characters start their journey at Fritz Park...", link: "https://maps.app.goo.gl/pE6Vigf3v23k8n7c7" },
  { title: "Fritz Park", image: "FritzPark.jpeg", description: "Our characters start their journey at Fritz Park...", link: "https://maps.app.goo.gl/pE6Vigf3v23k8n7c7" },
  { title: "Fritz Park", image: "FritzPark.jpeg", description: "Our characters start their journey at Fritz Park...", link: "https://maps.app.goo.gl/pE6Vigf3v23k8n7c7" },
  { title: "Main Street", image: "MainSt.jpeg", description: "The characters find themselves on Main Street...", link: "https://maps.app.goo.gl/JCEKmfUZGhwMUsk19" },
  { title: "Main Street", image: "MainSt.jpeg", description: "The characters find themselves on Main Street...", link: "https://maps.app.goo.gl/JCEKmfUZGhwMUsk19" },
  { title: "Main Street Mural", image: "MainStMural.jpeg", description: "The characters are at the Main Street Mural...", link: "https://maps.app.goo.gl/emHhw6qo744ud4Tg8" },
  { title: "Main Street Mural", image: "MainStMural.jpeg", description: "The characters are at the Main Street Mural...", link: "https://maps.app.goo.gl/emHhw6qo744ud4Tg8" },
  { title: "Western Mural", image: "WesternMural.png", description: "The characters try matching the piece they found...", link: "https://maps.app.goo.gl/PceWQKpwFHYws67g8" },
  { title: "Western Mural", image: "WesternMural.png", description: "The characters try matching the piece they found...", link: "https://maps.app.goo.gl/PceWQKpwFHYws67g8" },
  { title: "Heritage District", image: "TimelessIrving.jpeg", description: "Finally, the characters reach the Heritage District Mural...", link: "https://maps.app.goo.gl/B71UEjYBHzdg8Wjq9" },
  { title: "Heritage District", image: "TimelessIrving.jpeg", description: "Finally, the characters reach the Heritage District Mural...", link: "https://maps.app.goo.gl/B71UEjYBHzdg8Wjq9" },
  { title: "Heritage District", image: "TimelessIrving.jpeg", description: "Finally, the characters reach the Heritage District Mural...", link: "https://maps.app.goo.gl/B71UEjYBHzdg8Wjq9" },
  { title: "Heritage District", image: "TimelessIrving.jpeg", description: "Finally, the characters reach the Heritage District Mural...", link: "https://maps.app.goo.gl/B71UEjYBHzdg8Wjq9" },
  { title: "Heritage District", image: "TimelessIrving.jpeg", description: "Finally, the characters reach the Heritage District Mural...", link: "https://maps.app.goo.gl/B71UEjYBHzdg8Wjq9" },
  { title: "Heritage District", image: "TimelessIrving.jpeg", description: "Finally, the characters reach the Heritage District Mural...", link: "https://maps.app.goo.gl/B71UEjYBHzdg8Wjq9" },
];

function showSlide(index) {
  if(index >= totalSlides) index = 0;
  if(index < 0) index = totalSlides - 1;
  currentIndex = index;
  slides.style.transform = `translateX(-${index*100}%)`;
  document.getElementById('slide-number').innerText = `Slide ${currentIndex+1} of ${totalSlides}`;
  updateTab();
  hideInfo();
}

function nextSlide(){ showSlide(currentIndex+1); }
function prevSlide(){ showSlide(currentIndex-1); }

function swapCharacter(src='boy1.png'){
  document.querySelectorAll('.character').forEach(c=>{c.src=src;c.style.display='block';});
}

function updateTab(){
  const tab = document.getElementById('side-tab');
  if(currentIndex === 0){ tab.style.display='none'; }
  else{
    tab.style.display='block';
    tab.innerText = tabData[currentIndex]?.title || '';
  }
}

function toggleInfo(){
  const popup = document.getElementById('info-popup');
  if(popup.style.display==='block'){ popup.style.display='none'; }
  else{
    const data = tabData[currentIndex];
    document.getElementById('info-title').innerText = data.title;
    document.getElementById('info-img').src = data.image;
    document.getElementById('info-desc').innerText = data.description;
    document.getElementById('info-link').href = data.link;
    popup.style.display='block';
  }
}

document.addEventListener('click', function(e){
  const popup = document.getElementById('info-popup');
  const tab = document.getElementById('side-tab');
  if(popup.style.display==='block' && !popup.contains(e.target) && !tab.contains(e.target)){
    popup.style.display='none';
  }
});

// Initialize
window.onload = function(){
  swapCharacter('boy1.png');
  showSlide(0);
};
</script>

</body>
</html>
